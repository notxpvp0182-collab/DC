name: Build Android APK (Android 10+)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          gradle-home-cache-cleanup: true

      - name: Ensure Gradle Wrapper Exists
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ] || [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Clean Build Environment
        run: ./gradlew clean --no-daemon

      - name: Run Unit Tests
        run: ./gradlew test --no-daemon

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify Generated APK
        run: |
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "✅ APK generated successfully!"
            ls -lh app/build/outputs/apk/debug/app-debug.apk
            file_size=$(stat -c%s "app/build/outputs/apk/debug/app-debug.apk")
            if [ "$file_size" -lt 100000 ]; then
              echo "❌ Error: APK file is unexpectedly small ($file_size bytes)"
              exit 1
            fi
            echo "APK Size: $file_size bytes"
          else
            echo "❌ Error: app/build/outputs/apk/debug/app-debug.apk does not exist!"
            find app/build/outputs/apk -type f
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiscordClient-Android10Plus
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
